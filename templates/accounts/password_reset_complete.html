{% extends "base.html" %}
{% load static %}

{% block title %}Password updated | Tradex Academy{% endblock %}

{% block body_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background-color: var(--bg-app);">
  <div style="max-width: 400px; width: 100%;">
    <div class="card" style="padding: 32px 24px; text-align: center;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background-color: var(--accent-success-subtle); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--accent-success);">
        <i data-lucide="check" style="width: 20px; height: 20px;"></i>
      </div>

      <h1 style="font-size: 1.25rem; color: var(--text-primary); margin-bottom: 6px;">Password updated</h1>
      <p style="color: var(--text-secondary); font-size: 0.8125rem; margin-bottom: 24px;">
        Your password has been changed successfully. You can now sign in with your new credentials.
      </p>

      <a href="{% url 'accounts:signin' %}" class="btn btn-primary btn-block">
        Sign in to dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
