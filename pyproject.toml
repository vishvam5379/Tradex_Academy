[project]
name = "tradex-academy"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.2.0",
    "cryptography>=41.0.0",
    "dj-database-url>=2.1.0",
    "razorpay>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "whitenoise>=6.6.0",
    "requests>=2.31.0",
]

[tool.vercel]
entrypoint = "academy_core.wsgi:application"
